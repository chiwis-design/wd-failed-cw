
<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GENERATOR WD FAILED</title>

  <!-- HUBUNGKAN CSS -->
  <link rel="stylesheet" href="./style.css">
</head>

<body>

<div class="generator">

  <!-- HEADER -->
  <header class="header">
    <div class="brand">
      <span class="brand-icon">⚡</span>
      <div>
        <h1>
          GENERATOR <span>WD FAILED</span>
        </h1>
        <p>AUTO DATA CLEANER</p>
      </div>
    </div>

    <div class="live-status">
      <span class="pulse"></span>
      SYSTEM ONLINE
    </div>
  </header>

  <!-- INPUT DATA -->
  <div class="section-title">
    <span>01</span>
    INPUT DATA
  </div>

  <textarea
    id="inputData"
    placeholder="Tempel tabel transaksi ente di sini..."
  ></textarea>

  <!-- BUTTON -->
  <div class="buttons">
    <button id="processBtn" class="btn-primary" type="button">
      ⚡ PROSES DATA
    </button>

    <button id="resetBtn" class="btn-secondary" type="button">
      ↻ RESET
    </button>
  </div>

  <!-- STATUS -->
  <div class="status" id="status">
    <span class="status-dot"></span>
    Siap membaca transaksi!
  </div>

  <!-- OUTPUT HEADING -->
  <div class="result-heading">
    <div class="section-title">
      <span>02</span>
      HASIL DATA RAPI
    </div>

    <button id="copyBtn" class="copy-btn" type="button">
      ▣ SALIN HASIL
    </button>
  </div>

  <!-- OUTPUT DATA -->
  <div class="neon-frame">
    <textarea
      id="outputData"
      placeholder="Hasil transaksi akan muncul otomatis di sini..."
      readonly
    ></textarea>
  </div>

  <!-- FOOTER -->
  <footer>
    <span>♡ TRANSACTION GENERATOR ♡</span>
    <small>RED NEON EDITION • 2026</small>
  </footer>

</div>

<!-- HUBUNGKAN JAVASCRIPT -->
<script src="./script.js" defer></script>

</body>
</html>
